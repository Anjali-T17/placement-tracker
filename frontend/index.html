<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | Placement Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="sidebar"></div>

  <div class="main">
    <div id="topbar"></div>

    <div class="content">
      <div class="stats-grid" id="stats"></div>

      <div class="grid-2">
        <div class="card">
          <div class="card-head"><h2>Recent Applications</h2>
            <a href="applications.html" class="btn btn-outline btn-sm">View all</a>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Student</th><th>Company</th><th>Applied On</th><th>Status</th></tr></thead>
              <tbody id="recent-apps"></tbody>
            </table>
          </div>
        </div>

        <div class="card">
          <div class="card-head"><h2>Application Status</h2></div>
          <div id="status-bars"></div>
        </div>
      </div>

      <div class="grid-2-even">
        <div class="card">
          <div class="card-head"><h2>Upcoming Interviews</h2>
            <a href="interviews.html" class="btn btn-outline btn-sm">Schedule</a>
          </div>
          <div id="upcoming"></div>
        </div>

        <div class="card">
          <div class="card-head"><h2>Open Job Listings</h2>
            <a href="jobs.html" class="btn btn-outline btn-sm">Manage</a>
          </div>
          <div id="open-jobs"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script>
    renderLayout("dashboard", "Admin Dashboard", "Overview of campus placement activity");
    (async () => { try {
    await loadAll();
    const summary = await api.get("/dashboard/summary");

    // ----- Stat cards -----
    const stats = [
      { icon: "🎓", color: "blue",   num: summary.totalStudents,     lbl: "Total Students" },
      { icon: "💼", color: "green",  num: summary.openJobs,          lbl: "Open Job Listings" },
      { icon: "📝", color: "orange", num: summary.totalApplications, lbl: "Total Applications" },
      { icon: "🏆", color: "purple", num: summary.placementRate + "%", lbl: "Placement Rate" },
    ];
    document.getElementById("stats").innerHTML = stats.map((s) => `
      <div class="card stat">
        <div class="stat-icon ${s.color}">${s.icon}</div>
        <div><div class="num">${s.num}</div><div class="lbl">${s.lbl}</div></div>
      </div>`).join("");

    // ----- Recent applications -----
    const recent = [...DB.applications].sort((a, b) => b.appliedOn.localeCompare(a.appliedOn)).slice(0, 5);
    document.getElementById("recent-apps").innerHTML = recent.map((a) => {
      const s = getStudent(a.studentId), j = getJob(a.jobId);
      return `<tr>
        <td><div class="cell-main">${s.name}</div><div class="cell-sub">${s.rollNo}</div></td>
        <td><div class="cell-main">${j.company}</div><div class="cell-sub">${j.role}</div></td>
        <td>${formatDate(a.appliedOn)}</td>
        <td>${statusBadge(a.status)}</td></tr>`;
    }).join("");

    // ----- Status bars -----
    const statuses = ["Applied", "Shortlisted", "Interview Scheduled", "Selected", "Rejected"];
    const colors = ["#0284c7", "#d97706", "#9333ea", "#16a34a", "#dc2626"];
    document.getElementById("status-bars").innerHTML = statuses.map((st, i) => {
      const count = DB.applications.filter((a) => a.status === st).length;
      const pct = DB.applications.length ? (count / DB.applications.length) * 100 : 0;
      return `<div class="bar-row">
        <div class="bar-label"><span>${st}</span><strong>${count}</strong></div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${colors[i]}"></div></div>
      </div>`;
    }).join("");

    // ----- Upcoming interviews -----
    const upcoming = [...DB.interviews].sort((a, b) => a.date.localeCompare(b.date));
    document.getElementById("upcoming").innerHTML = upcoming.length
      ? upcoming.map((iv) => {
          const app = DB.applications.find((a) => a.id === iv.applicationId);
          const s = getStudent(app.studentId), j = getJob(app.jobId);
          const d = new Date(iv.date);
          return `<div class="list-item">
            <div class="date-box"><div class="d">${d.getDate()}</div>
              <div class="m">${d.toLocaleString("en", { month: "short" })}</div></div>
            <div><div class="cell-main">${s.name} → ${j.company}</div>
              <div class="cell-sub">${iv.time} · ${iv.mode} · ${iv.venue}</div></div>
          </div>`;
        }).join("")
      : `<div class="empty">No interviews scheduled</div>`;

    // ----- Open jobs -----
    document.getElementById("open-jobs").innerHTML = DB.jobs
      .filter((j) => j.status === "Open")
      .map((j) => `<div class="list-item">
        <div style="flex:1"><div class="cell-main">${j.company} — ${j.role}</div>
          <div class="cell-sub">${j.location} · Min CGPA ${j.minCgpa} · Deadline ${formatDate(j.deadline)}</div></div>
        <strong>${j.package} LPA</strong>
      </div>`).join("");
    } catch (e) { apiError(e); } })();
  </script>
</body>
</html>
