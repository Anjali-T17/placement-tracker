services:
  # Flask Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: placement-backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - HOST=0.0.0.0
      - PORT=5001
      - FLASK_DEBUG=0
      - DATABASE_PATH=/app/data/placement.db
      - DB_TYPE=sqlite
      - CORS_ORIGINS=http://localhost:5500,http://127.0.0.1:5500,http://localhost:5001,http://127.0.0.1:5001,*
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Nginx Frontend Web Server
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: placement-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5500}:80"
    depends_on:
      backend:
        condition: service_healthy

  # Optional Monitoring Services (start with: docker compose --profile monitoring up -d)
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    restart: unless-stopped
    profiles:
      - monitoring
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    restart: unless-stopped
    profiles:
      - monitoring
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  # Persistent volume for SQLite database storage across container restarts
  backend-data:
    driver: local